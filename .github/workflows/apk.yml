name: apk
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set server address
        run: sed -i 's#"43.155.11.190", 10443#"159.223.110.159", 54665#g' TMessagesProj/jni/tgnet/ConnectionsManager.cpp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew && ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: shtormgram-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
